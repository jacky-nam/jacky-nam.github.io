  <div class="page" id="top">

    <header class="nav">

    <main>

      <section class="section section--page" aria-labelledby="deck-heading">
        <h2 class="reveal" id="deck-heading"><span class="mono h-index">//</span>Reference Deck</h2>
        <p class="deck__actions reveal">
          <a class="btn btn--primary btn--link" href="ReferenceDeck.pdf" target="_blank" rel="noopener">

          </a>
          <a class="deck__download mono" href="ReferenceDeck.pdf" download>download instead</a>

        <div class="deck reveal">
          <object class="deck__frame" data="ReferenceDeck.pdf" type="application/pdf"
            title="Reference deck, PDF, embedded viewer">
            <p class="deck__fallback">
              Your browser won't display the PDF inline, which is normal on iOS and some mobile browsers. Use
              <a href="ReferenceDeck.pdf" target="_blank" rel="noopener">open the reference deck</a> above, or
              <a href="ReferenceDeck.pdf" download>download it</a>.
            </p>
          </object>
        </div>

        <p class="mono deck__note reveal">
          the embedded viewer is a convenience, the links above always work
        </p>
      </section>

    </main>

  </div>

  <script src="script.js?v=8"></script>
